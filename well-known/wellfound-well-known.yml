note: 'Wellfound serves a real, RFC-compliant discovery stack on two hosts. wellfound.com publishes OpenID
  Connect discovery, RFC 8414 authorization-server metadata and RFC 9728 protected-resource metadata naming
  an MCP resource; reach.wellfound.com publishes its own RFC 8414 + RFC 9728 pair for a second, separate
  MCP resource. Both hosts also serve a two-line RFC 9116 security.txt. trust.wellfound.ai answered 200
  with an identical HTML body on EVERY /.well-known/* path probed - it is a Vanta single-page trust center
  with a catch-all route, not a document surface, and every one of those 200s is recorded as a miss. status.wellfound.com
  serves a security.txt, but it is Atlassian''s PGP-signed vendor document (Canonical https://www.atlassian.com/.well-known/security.txt),
  not Wellfound''s, so it is recorded as vendor-served and not credited to Wellfound.


  MCP-host OAuth discovery added 2026-09-19 (roadmap#321/#337): the harvest visits a provider''s primary
  hosts, and RFC 9728 protected-resource metadata lives on the MCP host, so these documents existed and
  were invisible to the scorer. Fetched live and validated on `resource`/`issuer`; one negative control
  per host.'
