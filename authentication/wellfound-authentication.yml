summary: >-
  Two independent OAuth 2.1-shaped authorization servers, one per product. Both are
  authorization-code + PKCE (S256) only, both support refresh tokens, both expose RFC 7591
  dynamic client registration, and both protect an MCP resource advertised via RFC 9728. No
  API-key, basic-auth, mTLS or client-credentials path was found on either.

