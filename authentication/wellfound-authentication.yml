  pkce_required_for_public_clients: true
  authorization_response_iss_parameter_supported: true
  openid_connect_discovery: https://wellfound.com/.well-known/openid-configuration
  protects:
  - https://wellfound.com/api/mcp
  x-note: >-
    The scopes list is a single flat vocabulary mixing the six legacy AngelList social /
    investing scopes with the three new recruiter-application scopes. api.angel.co and every
