    url: scopes/wellfound-scopes.yml
  - type: OpenIDConnect
    url: well-known/wellfound-openid-configuration.json
- aid: wellfound:wellfound-reach-mcp
  name: Wellfound Reach MCP
  description: >-
    Remote MCP server for Wellfound Reach, the AI sourcing product. Seven scopes across four
    resources - projects:read, agents:read, agents:write, candidates:read, candidates:write,
    company_lists:read, company_lists:write - so an agent can read sourcing projects and both
    read and write the sourcing agents, candidates and company lists on an account. Its own
    authorization server at https://reach.wellfound.com accepts public clients only. The tool
    list is auth-gated.
  image: https://reach.wellfound.com/assets/marketing/og/homepage-2fb80e2936cb06211fa7702e4b089510c772d1b887166b884b4720f73445e875.png
