apis:
- aid: wellfound:wellfound-applications-mcp
  name: Wellfound Applications MCP
  description: >-
    Remote MCP server exposing a recruiter's inbound job applications to an agent, and letting
    it accept or reject them. Named "Wellfound recruiter applications" in its own RFC 9728
    protected-resource document. OAuth 2.1 authorization code + PKCE S256 with dynamic client
    registration; scopes applications:read, applications:accept, applications:reject. The tool
    list is auth-gated - an unauthenticated tools/list returns HTTP 401 with an RFC 9728
    WWW-Authenticate challenge.
  image: https://reach.wellfound.com/assets/marketing/og/homepage-2fb80e2936cb06211fa7702e4b089510c772d1b887166b884b4720f73445e875.png
  humanURL: https://wellfound.com/recruit/pricing
  baseURL: https://wellfound.com/api/mcp
