aid: wellfound
name: Wellfound
description: >-
  Wellfound (formerly AngelList Talent) is a startup hiring marketplace and AI recruiting
  platform operating wellfound.com, the Wellfound Reach AI sourcing product and the Autopilot
  managed-recruiting service. Its entire public machine-readable API surface is two
  OAuth-protected Model Context Protocol servers - https://wellfound.com/api/mcp for recruiter
  applications and https://reach.wellfound.com/mcp for Reach projects, sourcing agents,
  candidates and company lists - discovered from a complete RFC 8414 / RFC 9728 / OpenID
  Connect discovery stack and verified by probe. Wellfound publishes no OpenAPI document, no
  public GraphQL endpoint, no REST reference and no developer portal, so the discovery
  documents are the only published description of how to integrate.
